<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">RoomFlip conceptual project illustration</title><desc id="desc">An original illustrative project map, not a screenshot or live data.</desc><defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1018"/><stop offset="1" stop-color="#101e2b"/></linearGradient><radialGradient id="accent"><stop offset="0" stop-color="#87bddb" stop-opacity=".2"/><stop offset="1" stop-color="#87bddb" stop-opacity="0"/></radialGradient></defs><style>.glow{animation:pulse 5s ease-in-out infinite}.drift{animation:drift 8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.65}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.glow,.drift{animation:none!important}}</style><rect x="1" y="1" width="958" height="358" rx="24" fill="url(#background)" stroke="#33475a"/><circle class="glow" cx="310" cy="105" r="245" fill="url(#accent)"/><rect x="30" y="27" width="6" height="32" rx="3" fill="#87bddb" stroke="none"/><text x="54" y="48" fill="#99aec2" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2">05 / SPATIAL INTERACTION</text><text x="37" y="156" fill="#f3f8ff" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" >RoomFlip</text><text x="38" y="198" fill="#87bddb" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" >A space you can explore.</text><line x1="38" y1="226" x2="362" y2="226" stroke="#3b5265" stroke-width="1" /><text x="39" y="257" fill="#b0c0d1" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" >3D  /  Lighting  /  Layout</text><text x="39" y="320" fill="#7e92a7" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" letter-spacing="1">ORIGINAL ILLUSTRATION  ·  NOT A SCREENSHOT</text><rect