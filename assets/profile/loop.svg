<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-labelledby="t d"><title id="t">Discover, coordinate, execute, ship, observe</title><desc id="d">A five-stage product-building loop with a gently moving indicator. Animation is optional and respects reduced-motion preferences.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70d6ba"/><stop offset=".5" stop-color="#91b9ff"/><stop offset="1" stop-color="#70d6ba"/></linearGradient></defs><style>.runner{animation:travel 11s ease-in-out infinite alternate}.pulse{animation:fade 3s ease-in-out infinite alternate}@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(784px)}}@keyframes fade{0%{opacity:.25}100%{opacity:.8}}@media(prefers-reduced-motion:reduce){.runner,.pulse{animation:none!important}}</style><rect x="1" y="1" width="958" height="158" rx="22" fill="#0d1620" stroke="#34485b"/><text x="34" y="39" fill="#b9cbda" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2">THE BUILD LOOP</text><line x1="85" y1="90" x2="875" y2="90" stroke="#344e5c" stroke-width="3" /><line x1="85" y1="90" x2="875" y2="90" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 18"/><circle cx="86" cy="90" r="9" fill="#0d1620" stroke="#7098b2" stroke-width="2"/><circle cx="86" cy="90" r="3" fill="#7eafca"/><circle cx="282" cy="90" r="9" fill="#0d1620" stroke="#7098b2" stroke-width="2"/><circle cx="282" cy="90" r="3" fill="#7eafca"/><circle cx="478" cy="90" r="9" fill="#0d1620" stroke="#7098b2" stroke-width="2"/><circle cx="478" cy="90" r="3" fill="#7eafca"/><circle cx="674" cy="90" r="9" fill="#0d1620" stroke="#7098b2" stroke-width="2"/><circle cx="674" cy="90" r="3" fill="#7eafca"/><circle cx="870" cy="90" r="9" fill="#0d1620" stroke="#79debc" stroke-width="2"/><circle cx="870" cy="90" r="3" fill="#79debc"/><circle class="runner" cx="86" cy="90" r="5" fill="#f4e6ad"/><circle class="pulse" cx="86" cy="90" r="13" fill="none" stroke="#d4e4a9" opacity=".4"/><text x="86" y="125" fill="#c3d3e3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">DISCOVER</text><text x="282" y="125" fill="#c3d3e3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">COORDINATE</text><text x="478" y="125" fill="#c3d3e3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">EXECUTE</text><text x="674" y="125" fill="#c3d3e3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SHIP</text><text x="870" y="125" fill="#c3d3e3" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">OBSERVE</text></svg>