<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 218" role="img" aria-labelledby="title desc">
<title id="title">The independent build loop</title><desc id="desc">A five-step flow: discover, coordinate, execute, ship, observe. This is a design illustration, not live project status.</desc>
<defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#0B1322"/><stop offset="1" stop-color="#111F33"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#304453" opacity=".27" stroke-width=".8"/></pattern></defs>
<rect width="1100" height="218" rx="18" fill="url(#back)"/><rect width="1100" height="218" rx="18" fill="url(#grid)"/>
<circle cx="1050" cy="20" r="110" fill="#79E4CC" opacity=".035"/><circle cx="18" cy="208" r="110" fill="#F9B98E" opacity=".035"/>
<text x="48" y="36" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2.7" fill="#79E4CC">YOLOLAB / BUILD SYSTEMS THAT SHIP</text>
<text x="48" y="88" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" letter-spacing="-1.4" fill="#ECF8F5">Ideas into systems. Signals into decisions.</text>
<path d="M52 189H1047" stroke="#304453" stroke-width="2"/><path d="M52 189H1047" stroke="#79E4CC" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 8"/>
<rect x="49" y="115" width="183" height="62" rx="13" fill="#182739" stroke="#304453"/><circle cx="67" cy="137" r="5" fill="#79E4CC"/><text x="81" y="141" font-size="13" font-weight="700" letter-spacing=".7" fill="#ECF8F5">DISCOVER</text><text x="66" y="162" font-size="11" fill="#8AA2AE">find evidence</text><rect x="256" y="115" width="183" height="62" rx="13" fill="#182739" stroke="#304453"/><circle cx="274" cy="137" r="5" fill="#79E4CC"/><text x="288" y="141" font-size="13" font-weight="700" letter-spacing=".7" fill="#ECF8F5">COORDINATE</text><text x="273" y="162" font-size="11" fill="#8AA2AE">track dependencies</text><rect x="463" y="115" width="183" height="62" rx="13" fill="#182739" stroke="#304453"/><circle cx="481" cy="137" r="5" fill="#79E4CC"/><text x="495" y="141" font-size="13" font-weight="700" letter-spacing=".7" fill="#ECF8F5">EXECUTE</text><text x="480" y="162" font-size="11" fill="#8AA2AE">verify the work</text><rect x="670" y="115" width="183" height="62" rx="13" fill="#182739" stroke="#304453"/><circle cx="688" cy="137" r="5" fill="#79E4CC"/><text x="702" y="141" font-size="13" font-weight="700" letter-spacing=".7" fill="#ECF8F5">SHIP</text><text x="687" y="162" font-size="11" fill="#8AA2AE">make it usable</text><rect x="877" y="115" width="183" height="62" rx="13" fill="#182739" stroke="#304453"/><circle cx="895" cy="137" r="5" fill="#F9B98E"/><text x="909" y="141" font-size="13" font-weight="700" letter-spacing=".7" fill="#ECF8F5">OBSERVE</text><text x="894" y="162" font-size="11" fill="#8AA2AE">learn what worked</text>
<circle class="motion" cx="52" cy="189" r="5" fill="#F9B98E"><animate attributeName="cx" values="52;1047;52" dur="12s" repeatCount="indefinite"/></circle>
<text x="1052" y="207" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#8AA2AE">NOT A LIVE STATUS FEED</text>
<style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
</svg>